<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Codes Submission</title>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script> -->
    <script src="./xlsx.full.min.js"></script>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/tailwind.css">
</head>

<body>
    <div class="navbar bg-green-200 shadow-lg">
        <div class="flex justify-center w-full">
          <a class="btn btn-ghost text-3xl font-medium">Blue Eyes Tracking 
            <div class="avatar">
            <div class="w-12 rounded-full">
              <img src="images/BE-icon.png" />
            </div>
          </div>
        </a>
        </div>
    </div>
    
    <div class="w-full max-h-[50rem] relative mt-2">
        <div class="w-full h-full absolute bg-slate-900 opacity-60 hover:opacity-80 z-5">
        </div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 w-2/5 h-2/5">
            <div class="flex items-center justify-center flex-col">
                <div class="w-full h-full flex flex-col items-center justify-center">
                    <div class="text-3xl font-bold text-white mb-4">Start Your Tracking Now With Our Blue Eyes!</div>
                </div>
            <textarea id="tracking-codes" placeholder="Enter tracking codes, one per line..."
                class="textarea textarea-bordered textarea-md"></textarea>
            <button id="submit-btn" class="btn btn-accent btn-lg flex items-center">
                <span>TRACK</span>
                <div class="avatar">
                    <div class="w-12 rounded-full">
                        <img src="images/BE-icon.png" />
                    </div>
                </div>
            </button>
            </div>
        </div>
        <img src="./images/background-be.jpg" class="w-full max-h-[50rem] "/>
    </div>
    <div class="w-full flex flex-col justify-center items-center pt-6">
        <div class="font-semibold text-2xl flex items-center w-fit p-2 rounded-md bg-green-400 text-white">
            <div class="w-12 rounded-full mx-1">
                <img src="images/BE-icon.png" />
            </div>
            <span class="mx-1">RESULTS</span>
            <div class="w-12 rounded-full mx-1">
                <img src="images/BE-icon.png" />
            </div>
        </div>
    </div>
    <div class="flex justify-center w-full my-6">
        <div class="chat chat-start">
            <div class="chat-image avatar">
                <div class="w-36 rounded-full border-2 border-pink-500">
                  <img
                    alt="Tailwind CSS chat bubble component"
                    src="./images/vohung.jpg" />
                </div>
            </div>
            <div class="chat-header text-xl font-semibold">
              Vợ Hưng
              <time class="text-xs opacity-50"></time>
            </div>
            <div id="message-from-wife" class="chat-bubble text-4xl">Chờ chút nha cưng &lt;3</div>
            <div class="chat-footer opacity-50">Seen at 12:46</div>
        </div>
    </div>
    <div class="w-full flex flex-col justify-center items-center py-3">
        <div id="total-count" class="total-count text-xl font-semibold">Total Rows: 0</div>
        <div>
            <button id="download-csv-btn" class="btn btn-accent btn-outline">Download Excel</button>
        </div>
        <!-- Biểu tượng loading -->
        <div id="loading">
            <div class="spinner"></div>
        </div>
    </div>
    <div id="response" class="max-w-screen-xl mx-auto mt-10 p-4 m-4">
        <table id="response-table" class="table table-zebra w-full border-collapse border border-gray-300 rounded-lg">
            <thead>
                <tr>
                    <th class="px-1"><span class="text-base px-2">Tracking Code</span></th>
                    <th class="px-1"><span class="text-base px-2">Country</span> </th>
                    <th class="px-1"><span class="text-base px-2">Location</span></th>
                    <th class="px-1"><span class="text-base px-2">Date & Time</span></th>
                    <th class="px-1"><span class="text-base px-2">Status</span></th>
                    <th class="px-1"><span class="text-base px-2">Additional Info</span></th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be inserted here by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById('submit-btn').addEventListener('click', async () => {
            const trackingCodes = document.getElementById('tracking-codes').value
                .split('\n')
                .map(code => code.trim())
                .filter(code => code.length > 0);

            try {
                // Hiển thị biểu tượng loading
                document.getElementById('loading').style.display = 'block';

                const response = await fetch('/tracking', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ trackingCodes })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json(); // Read as JSON
                const result = data.result; // Extract result from JSON

                // Split result into rows
                const rows = result.split('\n').filter(row => row.trim() !== '');
                const tableBody = document.querySelector('#response-table tbody');

                // Clear previous results
                tableBody.innerHTML = '';

                rows.forEach((row, index) => {
                    const columns = row.split('\\'); // Split columns by '\\'

                    const tableRow = document.createElement('tr');

                    // Create cells for each column
                    columns.forEach(column => {
                        const cell = document.createElement('td');
                        cell.textContent = column;
                        tableRow.appendChild(cell);
                    });

                    // Add a copy button for the entire row
                    const copyRowBtn = document.createElement('button');
                    copyRowBtn.textContent = 'Copy Row';
                    copyRowBtn.className = 'row-copy-btn';
                    copyRowBtn.addEventListener('click', () => {
                        const rowData = Array.from(tableRow.children).map(cell => cell.textContent).join('\t');
                        const tempTextarea = document.createElement('textarea');
                        tempTextarea.value = rowData;
                        document.body.appendChild(tempTextarea);
                        tempTextarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(tempTextarea);
                        alert('Row data copied to clipboard!');
                    });
                    const buttonCell = document.createElement('td');
                    buttonCell.appendChild(copyRowBtn);
                    tableRow.appendChild(buttonCell);

                    tableBody.appendChild(tableRow);
                });

                // Update total row count
                document.getElementById('total-count').textContent = `Total Rows: ${rows.length}`;
                document.getElementById('message-from-wife').textContent = `Xong rồi nha cưng <3`;
            } catch (error) {
                console.error('Error fetching data:', error);
            } finally {
                // Ẩn biểu tượng loading sau khi xử lý xong
                document.getElementById('loading').style.display = 'none';
            }
        });

        // Add event listener for copy buttons
        document.querySelectorAll('.copy-btn').forEach(button => {
            button.addEventListener('click', () => {
                const colIndex = button.getAttribute('data-col');
                const table = document.querySelector('#response-table');
                const cells = table.querySelectorAll(`tbody tr td:nth-child(${parseInt(colIndex) + 1})`);

                // Create a temporary textarea to copy the text
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = Array.from(cells).map(cell => cell.textContent).join('\n');
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextarea);

                alert('Column data copied to clipboard!');
            });
        });

        // Add event listener for download CSV button
        document.getElementById('download-csv-btn').addEventListener('click', () => {
            const rows = document.querySelectorAll('#response-table tbody tr');
            const data = [];

            // Extract data from table rows
            rows.forEach(row => {
                const cells = Array.from(row.querySelectorAll('td')).map(cell => cell.textContent);
                data.push(cells);
            });

            // Create a workbook and worksheet
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);

            // Add the worksheet to the workbook
            XLSX.utils.book_append_sheet(wb, ws, 'Tracking Results');

            // Generate the Excel file and trigger the download
            XLSX.writeFile(wb, 'tracking_results.xlsx');
        });

    </script>
</body>

</html>
